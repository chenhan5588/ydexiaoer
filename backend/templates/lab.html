<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/printos-lab/">
  <title>PrintOS 单图实验室</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f5f7;color:#202124;margin:0}.wrap{max-width:1040px;margin:auto;padding:28px}
    .card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px;margin-bottom:18px}.drop{border:2px dashed #8b8fa3;padding:45px;text-align:center;border-radius:12px;cursor:pointer}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.preview{width:100%;height:360px;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 50%/20px 20px}
    button{background:#5146b7;color:white;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}.muted{color:#666;font-size:13px}.warn{color:#a15c00}.ok{color:#087f5b}
    @media(max-width:720px){.grid{grid-template-columns:1fr}.preview{height:260px}}
  </style>
</head>
<body><main class="wrap">
  <h1>PrintOS · DTF 单图实验室</h1>
  <p class="muted">目标：生成透明 PNG 候选文件，并诚实标记边缘和文字风险。</p>
  <section class="card">
    <label class="drop" id="drop">点击或拖入一张客户原图<input id="file" type="file" accept="image/*" hidden></label>
    <div style="margin-top:14px">
      <label>需要重建的小字（请人工确认）：
        <input id="smallText" placeholder="例如：électricité" style="padding:8px;width:220px">
      </label>
    </div>
    <div style="margin-top:14px"><button id="run" disabled>开始处理</button> <span id="state" class="muted"></span></div>
  </section>
  <section class="grid" id="result" hidden>
    <div class="card"><h3>客户原图</h3><img id="before" class="preview"></div>
    <div class="card"><h3>处理候选图</h3><img id="after" class="preview"><p id="verdict"></p><p id="metrics" class="muted"></p><div id="reasons" class="warn"></div><p><a id="download">下载透明 PNG</a></p></div>
  </section>
</main>
<script>
let selected=null;const file=document.querySelector('#file'),run=document.querySelector('#run'),drop=document.querySelector('#drop');
drop.onclick=()=>file.click();drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();choose(e.dataTransfer.files[0])};file.onchange=()=>choose(file.files[0]);
function choose(f){if(!f)return;selected=f;run.disabled=false;drop.textContent=f.name;document.querySelector('#before').src=URL.createObjectURL(f)}
run.onclick=async()=>{run.disabled=true;document.querySelector('#state').textContent='处理中…';const fd=new FormData();fd.append('image',selected);fd.append('smallText',document.querySelector('#smallText').value.trim());
try{const r=await fetch('api/dtf-lab',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'处理失败');
document.querySelector('#after').src=d.preview;document.querySelector('#result').hidden=false;
document.querySelector('#verdict').className=d.report.status==='pass'?'ok':'warn';document.querySelector('#verdict').textContent=d.report.status_label;
document.querySelector('#metrics').textContent=`${d.report.width}×${d.report.height}px · ${d.report.dpi}DPI · 边缘 ${d.report.edge_score} · 文字风险 ${d.report.text_risk}`;
document.querySelector('#reasons').innerHTML=d.report.review_reasons.map(x=>`<div>• ${x}</div>`).join('');
document.querySelector('#download').href='.'+d.download_url;document.querySelector('#download').download='';}
catch(e){alert(e.message)}finally{run.disabled=false;document.querySelector('#state').textContent='';}};
</script></body></html>
