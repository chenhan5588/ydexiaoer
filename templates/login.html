<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintAI Studio - 登录</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 48px 40px;
  width: 400px;
  max-width: 90vw;
  text-align: center;
}

.logo {
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}
.logo span { color: #6c63ff; }

.subtitle {
  color: rgba(255,255,255,0.5);
  font-size: 14px;
  margin-bottom: 36px;
}

.input-group {
  position: relative;
  margin-bottom: 24px;
}

.input-group input {
  width: 100%;
  padding: 14px 48px 14px 48px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: all 0.2s;
  text-align: center;
  letter-spacing: 2px;
}
.input-group input:focus {
  border-color: #6c63ff;
  background: rgba(255,255,255,0.12);
  box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
}

.input-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  opacity: 0.4;
}

.btn {
  width: 100%;
  padding: 14px;
  background: #6c63ff;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}
.btn:hover { background: #5a52d5; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.error {
  color: #ff6b6b;
  font-size: 13px;
  margin-top: 16px;
  min-height: 20px;
  transition: all 0.2s;
}

.footer {
  color: rgba(255,255,255,0.3);
  font-size: 12px;
  margin-top: 32px;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">Print<span>AI</span> Studio</div>
  <div class="subtitle">烫画来图质检与修复平台</div>

  <form method="POST" action="/login">
    <div class="input-group">
      <span class="input-icon">🔒</span>
      <input type="password" name="password" placeholder="请输入访问密码" autofocus>
    </div>
    <button type="submit" class="btn">进入系统</button>
  </form>

  <div class="error">{{ error or '' }}</div>

  <div class="footer">内部工具 · 仅供授权人员使用</div>
</div>

</body>
</html>
